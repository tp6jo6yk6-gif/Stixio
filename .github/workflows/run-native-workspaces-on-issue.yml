name: Run Native Workspaces On Issue

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  migrate:
    if: github.event.issue.title == '[automation] Run native workspaces now'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: bash scripts/run-embedded-native-migration.sh
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/native-workspaces
          commit-message: 'refactor: make activeEditor own native workspaces'
          title: 'Refactor native Workspaces'
          body: 'Automated core migration validated by syntax checks, unit tests, and static build.'
